# RexPlayerWarps configuration.
# config-version is used by the updater. Missing keys are filled in. Your values stay.
# A backup named config.yml.bak.<timestamp> is written before a change is saved.
# categories.yml is separate and is never overwritten.

config-version: 1

# sqlite writes plugins/RexPlayerWarps/<file>. mysql is optional.
storage:
  type: sqlite
  sqlite:
    file: warps.db
  mysql:
    host: 127.0.0.1
    port: 3306
    database: rexplayerwarps
    username: root
    password: ""
    # Pool size is clamped to 1-20. SQLite always uses 1.
    pool-size: 4

# Empty whitelist means every world. A world on the blacklist is blocked even if it is also listed.
worlds:
  whitelist: []
  blacklist: []

defaults:
  description: ""
  icon: ENDER_PEARL
  category: general
  price: 0
  access: public

limits:
  # Name length is clamped to 1-32. Description length is clamped to 1-512.
  name-length: 24
  description-length: 80
  price-min: 0
  price-max: 1000000
  search-length: 32
  # Recent view keeps this many of the viewer's latest visits.
  recent-size: 27

# full prints 10.50. short prints 1.2K, 3.4M, 5B.
number-format: full

# Type one of these words to clear a description with /set.
description-clear: clear
# Type this in chat to clear an active search.
search-cancel: cancel

unsafe:
  confirm: true
  # True when the feet position is below the world minimum height.
  void: true
  blocks:
    - LAVA
    - WATER
    - FIRE
    - SOUL_FIRE
    - CACTUS
    - SWEET_BERRY_BUSH

teleport:
  # Seconds. 0 charges (if the warp is not free) and teleports on the same tick the delay would have ended.
  # Money is taken only after this delay, and only if the player is still eligible.
  delay-seconds: 3
  cancel-on-move: true
  cancel-on-damage: true
  # Owners skip the price, and the bank is not credited, when this is false.
  owner-pays: false
  price-confirm: true
  confirm-seconds: 15

economy:
  # vault or command. command reads balance-placeholder and runs take/give as console.
  mode: vault
  command:
    balance-placeholder: "%vault_eco_balance%"
    take: "eco take {player} {amount}"
    give: "eco give {player} {amount}"

# The menu cycles these keys, in this order. Unknown keys are ignored.
# Allowed: name, owner, rating, visits, newest, oldest, price, favorites, category.
sorts:
  - name
  - owner
  - rating
  - visits
  - newest
  - oldest
  - price
  - favorites
  - category

sort-labels:
  name: Name
  owner: Owner
  rating: Rating
  visits: Visits
  newest: Newest
  oldest: Oldest
  price: Price
  favorites: Favorites
  category: Category

# An empty sound name plays nothing.
sounds:
  click:
    sound: UI_BUTTON_CLICK
    volume: 0.6
    pitch: 1.2
  teleport:
    sound: ENTITY_ENDERMAN_TELEPORT
    volume: 1.0
    pitch: 1.0
  error:
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 1.0
  cancel:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 0.8
  collect:
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 1.0
    pitch: 1.2

titles:
  countdown:
    enabled: true
    title: "<yellow>Teleporting"
    subtitle: "<gray>{seconds}s <dark_gray>- <white>{warp}"
    fade-in: 0
    stay: 15
    fade-out: 5
  arrived:
    enabled: true
    title: "<green>{warp}"
    subtitle: "<gray>{owner}"
    fade-in: 5
    stay: 30
    fade-out: 10

actionbar:
  countdown:
    enabled: false
    text: "<yellow>{warp} <gray>{seconds}s"

bossbar:
  countdown:
    enabled: false
    text: "<yellow>Teleporting to {warp}"
    # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    color: YELLOW
    # SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
    style: SOLID

particles:
  teleport:
    enabled: false
    type: PORTAL
    count: 24

# Rows are clamped to 1-6. Slot -1 hides a button. Clicks outside this menu are not cancelled.
gui:
  rows: 6
  title: "<dark_gray>Warps <gray>({page}/{pages})"
  favorite-glow: true
  clicks:
    teleport: LEFT
    favorite: RIGHT
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
    lore: []
    custom-model-data: 0
    glow: false
  warp-slots:
    - 10
    - 11
    - 12
    - 13
    - 14
    - 15
    - 16
    - 19
    - 20
    - 21
    - 22
    - 23
    - 24
    - 25
    - 28
    - 29
    - 30
    - 31
    - 32
    - 33
    - 34
  buttons:
    previous:
      slot: 45
      material: ARROW
      name: "<yellow>Previous"
      lore:
        - "<gray>Page {page}"
      custom-model-data: 0
      glow: false
    next:
      slot: 53
      material: ARROW
      name: "<yellow>Next"
      lore:
        - "<gray>{pages} pages"
      custom-model-data: 0
      glow: false
    sort:
      slot: 49
      material: HOPPER
      name: "<gold>Sort: <white>{sort}"
      lore:
        - "<gray>Click to cycle"
      custom-model-data: 0
      glow: false
    search:
      slot: 48
      material: OAK_SIGN
      name: "<aqua>Search"
      lore:
        - "<gray>{search}"
      custom-model-data: 0
      glow: false
    recent:
      slot: 47
      material: CLOCK
      name: "<yellow>Recent"
      lore:
        - "<gray>Warps you have used"
      custom-model-data: 0
      glow: false
    favorites:
      slot: 51
      material: NETHER_STAR
      name: "<light_purple>Favorites"
      lore:
        - "<gray>Only bookmarked warps"
      custom-model-data: 0
      glow: false
    category:
      slot: 50
      material: BOOKSHELF
      name: "<green>Category: <white>{category}"
      lore:
        - "<gray>Click to cycle"
      custom-model-data: 0
      glow: false
    close:
      slot: -1
      material: BARRIER
      name: "<red>Close"
      lore: []
      custom-model-data: 0
      glow: false

