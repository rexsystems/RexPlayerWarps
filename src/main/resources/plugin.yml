name: RexPlayerWarps
version: '${project.version}'
main: me.rexsystems.rexPlayerWarps.RexPlayerWarps
api-version: '1.21'
folia-supported: true
authors: [RexSystems]
description: Player warps with ratings, a warp bank, and a configurable menu
website: https://rexsystems.me
softdepend: [PlaceholderAPI, Vault]

commands:
  rexplayerwarps:
    description: Open and manage player warps
    aliases: [rpwarp, pwarp]
    usage: /rexplayerwarps <create|delete|set|list|open|favorite|rate|collect|whitelist|reload|help>

permissions:
  rexplayerwarps.use:
    description: Open the warp menu, favorite, and rate
    default: true
  rexplayerwarps.create:
    description: Create and edit your own warps
    default: true
  rexplayerwarps.reload:
    description: Reload RexPlayerWarps
    default: op
  rexplayerwarps.admin:
    description: Edit or delete another player's warp and visit private warps
    default: op
  rexplayerwarps.warps.1:
    description: Allows 1 warp. Any rexplayerwarps.warps.<n> node counts, and the highest n wins.
    default: false
  rexplayerwarps.warps.3:
    description: Allows 3 warps
    default: false
  rexplayerwarps.warps.5:
    description: Allows 5 warps
    default: false
  rexplayerwarps.warps.10:
    description: Allows 10 warps
    default: false
